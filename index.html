<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Pearl Sandbox</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="canvas-container">
		<canvas id="app-canvas"></canvas>
	</div>

	<div id="ui-overlay">
		<div id="control-box">
			<div class="header">
				<h3>Lab Sandbox</h3>
				<span id="counter">0 / 500</span>
			</div>

			<div class="control-group">
				<label>Beaker Size: <span id="val-box">7</span></label>
				<input type="range" id="slider-box" min="4" max="12" step="0.5" value="7">
			</div>

			<div class="control-group">
				<label>Spawn Count: <span id="val-click">20</span></label>
				<input type="range" id="slider-click" min="1" max="50" value="20">
			</div>

			<div class="control-group">
				<label>Element Colors</label>
				<div id="colors">
					<button data-c="0xffd700" class="color-btn active" title="Gold" style="background:#ffd700;"></button>
					<button data-c="0xb87333" class="color-btn" title="Copper" style="background:#b87333;"></button>
					<button data-c="0xe5e4e2" class="color-btn" title="Platinum" style="background:#e5e4e2;"></button>
					<button data-c="0x38bdf8" class="color-btn" title="Neon" style="background:#38bdf8;"></button>
					<button data-c="0x34d399" class="color-btn" title="Copper Sulfate" style="background:#34d399;"></button>
				</div>
			</div>

			<button id="btn-gravity">Invert Gravity</button>
			<button id="btn-vortex">Magnetic Stirrer</button>
			<button id="btn-clear">Empty Beaker</button>
		</div>

		<div id="gizmo-container">
			<canvas id="gizmo-canvas"></canvas>
		</div>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
